[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "stock-ml-dynamic"
version = "0.1.0"
description = "Postgres-backed stock ML analytics"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2"]
notebook = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<8", "matplotlib>=3.9,<4"]
neural = ["torch>=2.5"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
